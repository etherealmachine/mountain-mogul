<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!--
    Minty Fresh — company logo.

    A tall, slightly tapered highball holding a mojito: pale mint liquid
    to the bottom of the glass, tumbling ice, bubbles, a striped straw down to the
    bottom, a lime wheel slotted onto the rim, and a fan of mint leaves. The
    glass silhouette and the green sprig are the two strong shapes, so it
    still reads small. Rasterised to logo.png by tools/icons/logo.sh.
  -->
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f2cf"/>
      <stop offset="0.55" stop-color="#9fd8a8"/>
      <stop offset="1" stop-color="#6fbd8a"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6eef2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd36f"/>
      <stop offset="1" stop-color="#2f9a4a"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fae5a"/>
      <stop offset="1" stop-color="#226e38"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f5a36" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f5a36" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inside">
      <path d="M 60 100 L 72 290 Q 74 302 86 302 L 154 302 Q 166 302 168 290 L 180 100 Z"/>
    </clipPath>
    <clipPath id="aboveSurface">
      <rect x="0" y="0" width="240" height="124"/>
    </clipPath>
    <!-- The straw, from the bottom of the glass up past the rim's left side. -->
    <g id="straw" transform="translate(112 290) rotate(-12)">
      <rect x="-5" y="-236" width="10" height="236" rx="3" fill="#ffffff" stroke="#1f5a36" stroke-width="2"/>
      <g fill="#5cc27a">
      <rect x="-4" y="-226" width="8" height="9"/>
      <rect x="-4" y="-208" width="8" height="9"/>
      <rect x="-4" y="-190" width="8" height="9"/>
      <rect x="-4" y="-172" width="8" height="9"/>
      <rect x="-4" y="-154" width="8" height="9"/>
      <rect x="-4" y="-136" width="8" height="9"/>
      <rect x="-4" y="-118" width="8" height="9"/>
      <rect x="-4" y="-100" width="8" height="9"/>
      <rect x="-4" y="-82" width="8" height="9"/>
      <rect x="-4" y="-64" width="8" height="9"/>
      <rect x="-4" y="-46" width="8" height="9"/>
      <rect x="-4" y="-28" width="8" height="9"/>
      <rect x="-4" y="-10" width="8" height="9"/>
      </g>
    </g>
    <!-- One mint leaf, pointing up from its base at the origin. -->
    <g id="mintLeaf">
      <path d="M 0 0 C -9 -6 -11 -18 -6 -28 C -3 -34 0 -37 0 -40 C 0 -37 3 -34 6 -28 C 11 -18 9 -6 0 0 Z"
            fill="url(#leaf)" stroke="#1f5a36" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M 0 -2 L 0 -36" stroke="#1f5a36" stroke-width="0.9" fill="none"/>
      <path d="M 0 -12 L -5 -16 M 0 -12 L 5 -16 M 0 -21 L -4 -25 M 0 -21 L 4 -25"
            stroke="#1f5a36" stroke-width="0.6" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Shadow under the glass. -->
  <ellipse cx="120" cy="304" rx="64" ry="8" fill="url(#shadow)"/>

  <!-- ── Back of the glass: the far half of the rim ──────────── -->
  <ellipse cx="120" cy="100" rx="60" ry="8" fill="#f2fbf6" fill-opacity="0.45"/>
  <path d="M 60 100 A 60 8 0 0 1 180 100" fill="none" stroke="#1f5a36" stroke-width="5" stroke-linecap="round"/>
  <path d="M 65 101 A 55 5.5 0 0 1 175 101" fill="none" stroke="#bfe6cf" stroke-width="1.6"/>

  <!-- ── Mint sprig, its stem down into the drink ──────────────── -->
  <g transform="translate(130 104)">
    <path d="M 1 26 L -2 -30" stroke="#2d6b3d" stroke-width="3" stroke-linecap="round"/>
    <use href="#mintLeaf" transform="translate(-1 -14) rotate(-62) scale(1.0)"/>
    <use href="#mintLeaf" transform="translate(0 -14) rotate(60) scale(1.0)"/>
    <use href="#mintLeaf" transform="translate(-1 -26) rotate(-30) scale(1.2)"/>
    <use href="#mintLeaf" transform="translate(-1 -26) rotate(30) scale(1.15)"/>
    <use href="#mintLeaf" transform="translate(-2 -30) rotate(-2) scale(1.35)"/>
  </g>

  <!-- ── The drink, filling the glass to its bottom ────────────── -->
  <g clip-path="url(#inside)">
    <rect x="50" y="124" width="140" height="180" fill="url(#liquid)"/>
    <!-- The straw down in the drink, seen through it. -->
    <use href="#straw" opacity="0.55"/>
    <!-- Ice. -->
    <g stroke="#a9cdd6" stroke-width="1.5">
      <rect x="-17" y="-17" width="34" height="34" rx="7" fill="url(#ice)" transform="translate(100 150) rotate(-12)"/>
      <rect x="-16" y="-16" width="32" height="32" rx="7" fill="url(#ice)" transform="translate(138 146) rotate(18)"/>
      <rect x="-15" y="-15" width="30" height="30" rx="7" fill="url(#ice)" transform="translate(118 182) rotate(6)"/>
      <rect x="-13" y="-13" width="26" height="26" rx="6" fill="url(#ice)" transform="translate(148 210) rotate(-24)" opacity="0.92"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <path d="M 90 140 l 10 -3"/>
      <path d="M 130 136 l 9 3"/>
    </g>
    <!-- Bubbles. -->
    <g fill="#ffffff" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.6">
      <circle cx="92" cy="214" r="3"/>
      <circle cx="98" cy="236" r="2"/>
      <circle cx="88" cy="258" r="2.5"/>
      <circle cx="104" cy="280" r="2"/>
      <circle cx="150" cy="244" r="2.5"/>
      <circle cx="144" cy="266" r="1.8"/>
      <circle cx="132" cy="286" r="2.2"/>
      <circle cx="126" cy="222" r="1.6"/>
      <circle cx="116" cy="250" r="2.2"/>
    </g>
    <!-- The liquid's surface. -->
    <ellipse cx="120" cy="124" rx="58" ry="6" fill="#e6f8e2" stroke="#9fd8a8" stroke-width="1"/>
  </g>
  <!-- The straw above the surface. -->
  <g clip-path="url(#aboveSurface)"><use href="#straw"/></g>

  <!-- ── Lime wheel slotted onto the rim, right ─────────────────── -->
  <g transform="translate(179 89) rotate(8)">
    <circle r="22" fill="#9bcf3c" stroke="#3f7d1f" stroke-width="2.5"/>
    <circle r="18" fill="#e4f5a6"/>
    <g stroke="#b9dd62" stroke-width="2" stroke-linecap="round">
      <path d="M 0 -16 L 0 16 M -16 0 L 16 0 M -11.3 -11.3 L 11.3 11.3 M -11.3 11.3 L 11.3 -11.3"/>
    </g>
    <circle r="3" fill="#f6fbe0"/>
  </g>
  <!-- ── Front of the glass: walls, the near half of the rim ───── -->
  <!-- The glass's inner face, showing its thickness and heavy bottom. -->
  <path d="M 65.5 105 L 76.5 287 Q 78 295.5 88 295.5 L 152 295.5 Q 162 295.5 163.5 287 L 174.5 105"
        fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.6" stroke-linejoin="round"/>
  <path d="M 60 100 L 72 290 Q 74 302 86 302 L 154 302 Q 166 302 168 290 L 180 100"
        fill="none" stroke="#1f5a36" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 65 101 A 55 5.5 0 0 0 175 101" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8"/>
  <path d="M 60 100 A 60 8 0 0 0 180 100" fill="none" stroke="#1f5a36" stroke-width="5" stroke-linecap="round"/>
  <!-- The lime's slit, the rim pushed up into it. -->
  <path d="M 180 99 L 179.4 90" stroke="#3f7d1f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Highlights down the glass. -->
  <path d="M 70 116 L 80 284" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M 82 120 L 84 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 168 130 L 163 210" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 92 108 Q 120 111 150 108" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
